<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="/docs/brain.png">
</head>
<body>
    <div class="container">
        <header class="header">
            <h2 class="title">Jogo da Memória</h2>
            <p class="subtitle">Você consegue encontrar todos os pares?</p>
        </header>

        <main class="main">
            <div class="game-board" id="gameBoard"></div>

            <div class="controls">
                <button class="btn btn-primary" id="resetBtn">Novo Jogo</button>
            </div>
        </main>
    </div>

    <div class="modal" id="victoryModal">
        <div class="modal-content victory-content">
            <h2>Parabéns! 🎉</h2>
            <p class="victory-stats">
                Você venceu em <span id="finalMoves">0</span> movimentos
            </p>
            <button class="btn btn-primary" id="restartBtn">Tentar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
